<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101a3a" />
    <title>Pixel Run &amp; Leap</title>
  </head>
  <body>
    <main id="game" aria-label="Pixel Run &amp; Leap 遊戲畫面"></main>
    <nav class="touch-controls" aria-label="觸控操作">
      <button id="touch-left" type="button" aria-label="向左">←</button>
      <button id="touch-right" type="button" aria-label="向右">→</button>
      <button id="touch-down" type="button" aria-label="蹲下">蹲</button>
      <button id="touch-fire" type="button" aria-label="發射火球">火</button>
      <button id="touch-jump" type="button" aria-label="跳躍">跳</button>
    </nav>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
